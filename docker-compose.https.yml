# HTTPS 배포용 오버레이.
#
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
#
# 기본 파일만 쓰면 지금처럼 8080 으로 HTTP 만 받는다.
# 브라우저가 카메라·마이크를 쓰려면 HTTPS 가 필요해서(localhost 는 예외)
# 배포 서버에서만 이 파일을 함께 올린다.
#
# 로컬에는 인증서가 없다. 이 파일을 끼우면 프록시가 뜨지 않으므로 로컬에서는 쓰지 않는다.
services:
  proxy:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      # live 아래 파일은 archive 를 가리키는 상대 심볼릭 링크다.
      # /etc/letsencrypt 를 통째로, 같은 경로에 마운트해야 링크가 풀린다.
      - /etc/letsencrypt:/etc/letsencrypt:ro
