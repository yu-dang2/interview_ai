<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹캠 녹화 컴포넌트 (면접 영상 녹화 → 서버 업로드)</title>
<!--
  ============================================================
  면접 영상 녹화 컴포넌트 (지원님 전달용)
  ============================================================
  - 브라우저에서 웹캠+마이크를 녹화(MediaRecorder) → 서버에 업로드
  - 우리 방식이 "녹화 후 업로드"라, 이 파일이 그 녹화 부분을 담당함
  - Streamlit에 끼우는 방법은 맨 아래 [Streamlit 연동] 주석 참고

  [지원님이 바꿔야 할 곳] → 아래 CONFIG 두 줄
    BACKEND_URL  : 유정님 백엔드 주소
    INTERVIEW_ID : 현재 면접 ID (Streamlit에서 넘겨주면 됨)
  ============================================================
-->
<style>
  * { box-sizing: border-box; }
  body { font-family: "Malgun Gothic", system-ui, sans-serif; margin: 0; padding: 12px; }
  .rec-box { max-width: 340px; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
  .rec-video-wrap { position: relative; width: 100%; height: 210px; background: #1f2937; }
  .rec-video-wrap video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .rec-dot { position: absolute; top: 8px; left: 8px; display: none; align-items: center; gap: 6px;
             font-size: 12px; color: #fff; background: rgba(0,0,0,.55); border-radius: 6px; padding: 3px 8px; }
  .rec-dot.on { display: inline-flex; }
  .rec-dot .blink { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; animation: b 1s infinite; }
  @keyframes b { 50% { opacity: .3; } }
  .rec-controls { padding: 10px; display: flex; gap: 8px; }
  .rec-controls button { flex: 1; padding: 9px; font-size: 13px; border-radius: 8px; border: 1px solid #2563eb;
             background: #2563eb; color: #fff; cursor: pointer; }
  .rec-controls button.stop { background: #ef4444; border-color: #ef4444; }
  .rec-controls button:disabled { opacity: .4; cursor: default; }
  .rec-status { padding: 0 10px 10px; font-size: 12px; color: #6b7280; min-height: 18px; }
</style>
</head>
<body>
<div class="rec-box">
  <div class="rec-video-wrap">
    <video id="preview" autoplay playsinline muted></video>
    <span class="rec-dot" id="recDot"><span class="blink"></span> 녹화 중</span>
  </div>
  <div style="padding: 10px 10px 0;">
    <select id="camSelect" style="display:none; width:100%; padding:7px; font-size:12px; border:1px solid #d1d5db; border-radius:8px;"></select>
  </div>
  <div class="rec-controls">
    <button id="startBtn">녹화 시작</button>
    <button id="stopBtn" class="stop" disabled>녹화 중지 · 업로드</button>
  </div>
  <div class="rec-status" id="status">웹캠 준비됨. 면접 시작 시 녹화를 눌러주세요.</div>
</div>

<script>
// ===================== CONFIG (지원님이 바꿀 곳) =====================
const BACKEND_URL  = "http://localhost:8000";   // 유정님 백엔드 주소
const INTERVIEW_ID = "TEST_INTERVIEW_1";         // 현재 면접 ID (Streamlit에서 주입)
// ===================================================================

const preview  = document.getElementById("preview");
const startBtn = document.getElementById("startBtn");
const stopBtn  = document.getElementById("stopBtn");
const statusEl = document.getElementById("status");
const recDot   = document.getElementById("recDot");
const camSelect = document.getElementById("camSelect");
// 가상 카메라(신호 없이 X로 뜨는 것들) — 자동 회피용
const VIRTUAL_HINT = /miramix|virtual|obs|snap|droidcam|manycam|xsplit|ndi/i;

let stream = null;
let recorder = null;
let chunks = [];

function setStatus(msg) { statusEl.textContent = msg; }

// 지정한 카메라(deviceId)로 스트림을 연다. 오디오는 항상 포함. 기존 스트림은 정리.
async function openStream(deviceId) {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  const video = deviceId ? { deviceId: { exact: deviceId } } : { width: 640, height: 480 };
  stream = await navigator.mediaDevices.getUserMedia({ video, audio: true });
  preview.srcObject = stream;
}

// 1) 웹캠+마이크 켜기 (미리보기) + 카메라 목록 채우기
async function initCamera() {
  // 미리보기 패널/비보안 환경이면 카메라 API 자체가 없음
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus("이 환경에선 카메라를 쓸 수 없어요. 실제 브라우저 탭(http://localhost)에서 열어주세요.");
    startBtn.disabled = true;
    return;
  }
  try {
    // 권한을 얻어야 카메라 '이름'이 보이므로, 먼저 아무 카메라나 연다
    await openStream(undefined);

    // 카메라 목록을 드롭다운에 채운다
    const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
    camSelect.innerHTML = "";
    devices.forEach((d, i) => {
      const opt = document.createElement("option");
      opt.value = d.deviceId;
      opt.textContent = d.label || ("카메라 " + (i + 1));
      camSelect.appendChild(opt);
    });
    camSelect.style.display = devices.length > 1 ? "block" : "none";

    // 지금 잡힌 게 가상 카메라(Miramix 등)이고 진짜 카메라가 따로 있으면 그쪽으로 자동 전환
    const cur = stream.getVideoTracks()[0];
    const real = devices.find((d) => !VIRTUAL_HINT.test(d.label));
    if (cur && VIRTUAL_HINT.test(cur.label) && real) {
      await openStream(real.deviceId);
    }
    const active = stream.getVideoTracks()[0];
    if (active) camSelect.value = active.getSettings().deviceId || "";

    setStatus("웹캠 준비됨. 화면이 안 나오면 위에서 카메라를 바꿔주세요. 면접 시작 시 녹화를 눌러주세요.");
  } catch (e) {
    setStatus("카메라/마이크 접근 실패: " + e.name + " (권한 허용 / 다른 앱 종료 후 새로고침 / 실제 브라우저 탭에서 열기)");
    startBtn.disabled = true;
  }
}

// 드롭다운에서 카메라를 바꾸면 그 장치로 다시 연다 (녹화 중엔 잠금)
camSelect.addEventListener("change", async () => {
  if (recorder && recorder.state === "recording") {
    setStatus("녹화 중엔 카메라를 바꿀 수 없어요. 중지 후 변경하세요.");
    return;
  }
  try {
    await openStream(camSelect.value);
    setStatus("카메라 전환됨: " + (stream.getVideoTracks()[0] ? stream.getVideoTracks()[0].label : ""));
  } catch (e) {
    setStatus("이 카메라를 열 수 없어요 (" + e.name + "). 다른 걸 선택하세요.");
  }
});

// 2) 녹화 시작
startBtn.addEventListener("click", () => {
  if (!stream) return;
  chunks = [];
  // webm(vp8/opus)로 녹화 — 브라우저 호환 좋음
  recorder = new MediaRecorder(stream, { mimeType: "video/webm" });
  recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
  recorder.onstop = uploadVideo;   // 중지되면 업로드
  recorder.start();
  recDot.classList.add("on");
  startBtn.disabled = true;
  stopBtn.disabled = false;
  setStatus("녹화 중… 면접이 끝나면 '녹화 중지'를 눌러주세요.");
});

// 3) 녹화 중지 → onstop에서 업로드
stopBtn.addEventListener("click", () => {
  if (recorder && recorder.state !== "inactive") recorder.stop();
  recDot.classList.remove("on");
  stopBtn.disabled = true;
  setStatus("녹화 완료. 업로드 중…");
});

// 4) 서버 업로드 (인터페이스 ②: POST /interview/{id}/video, webm 파일)
async function uploadVideo() {
  const blob = new Blob(chunks, { type: "video/webm" });
  const form = new FormData();
  form.append("video", blob, `interview_${INTERVIEW_ID}.webm`);
  try {
    const res = await fetch(`${BACKEND_URL}/interview/${INTERVIEW_ID}/video`, {
      method: "POST",
      body: form,
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    setStatus("업로드 완료! 서버에서 영상 분석이 진행됩니다.");
    notifyStreamlit({ status: "uploaded", interview_id: INTERVIEW_ID });
  } catch (e) {
    setStatus("업로드 실패: " + e.message + " (백엔드 주소/서버 상태 확인)");
    startBtn.disabled = false;   // 재시도 가능하게
  }
}

// 5) Streamlit에 "업로드 완료" 알리기 (커스텀 컴포넌트로 쓸 때만 동작)
function notifyStreamlit(payload) {
  try {
    if (window.Streamlit) window.Streamlit.setComponentValue(payload);
  } catch (_) {}
}

initCamera();
</script>

<!--
  ============================================================
  [Streamlit 연동 방법] — 지원님용
  ============================================================
  ⚠️ 중요: Streamlit 컴포넌트는 iframe 안에서 돌아서, 카메라 권한이
     막힐 수 있음. iframe에 allow="camera; microphone" 이 필요함.

  방법 A) 간단 — st.components.v1.html (단, allow 속성 제약 있을 수 있음)
     import streamlit.components.v1 as components
     html = open("webcam_recorder.html", encoding="utf-8").read()
     html = html.replace("TEST_INTERVIEW_1", 실제_면접ID)
     components.html(html, height=340)
     → 카메라가 막히면 방법 B로.

  방법 B) 권장 — Streamlit 커스텀 컴포넌트로 감싸기
     - components.declare_component 로 이 HTML을 컴포넌트화
     - iframe에 allow="camera; microphone" 지정
     - notifyStreamlit()의 setComponentValue로 "업로드 완료"를 파이썬이 받음
     - (streamlit 공식 "Create a Component" 문서 참고)

  방법 C) 대안 — streamlit-webrtc 라이브러리
     - 웹캠 캡처를 라이브러리가 처리(권한 문제 적음)
     - 단 실시간 스트리밍용이라, 녹화 후 업로드 방식엔 손이 더 감

  [업로드 대상] 유정님 백엔드: POST /interview/{id}/video  (form field: "video", webm)
  [분석 결과]   업로드 후, 리포트 화면에서 GET /interview/{id}/video-metrics 로 조회
  ============================================================
-->
</body>
</html>
