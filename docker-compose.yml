# 로컬·내부 배포용 구성
#
#   docker compose up --build
#   docker compose down          (데이터는 볼륨에 남는다)
#   docker compose down -v       (볼륨까지 삭제)
#
# 다 뜨면 화면은 http://localhost:8501, API 문서는 http://localhost:8000/docs.
# 직무 지식 인덱스는 최초 한 번만 만들면 볼륨에 남는다.
#   docker compose exec api python scripts/build_knowledge_index.py
#
# .env 파일이 필요하다. .env.example 을 복사해서 값을 채운다.
# 특히 SECRET_KEY 는 반드시 고정값을 넣어야 재배포해도 로그인이 유지된다.

services:
  db:
    image: mysql:8.0
    environment:
      # 컨테이너 기본 시간대는 UTC 다. 앱과 DB 가 같은 UTC 면 시간 계산은 맞지만,
      # created_at 이 UTC 로 저장돼 화면에 9시간 이른 날짜가 찍힌다(밤에 본 면접이
      # 전날로 표시됨). api 와 함께 KST 로 맞춘다. 한쪽만 바꾸면 제한 시간 계산이
      # 어긋나므로 반드시 두 서비스를 같이 둔다.
      TZ: ${TZ:-Asia/Seoul}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-interview_ai}
      MYSQL_USER: ${MYSQL_USER:-interview_ai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-interview_ai!}
    # utf8mb4 로 맞춰야 한글이 깨지지 않는다.
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # 앱이 DB 준비 전에 뜨면 create_all 이 실패한다.
      #
      # -h 127.0.0.1 로 TCP 를 확인해야 한다. localhost 는 유닉스 소켓을 쓰는데,
      # MySQL 8 은 첫 기동 때 초기화용 임시 서버를 소켓으로만 띄운다. 그래서
      # 소켓 검사는 TCP 포트가 열리기 전에 통과해버리고, api 가 붙으려다
      # Connection refused 로 죽는다.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    # DB 가 잠깐 끊기거나 기동 순서가 어긋나도 스스로 복구하게 둔다.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # db 와 같은 시간대여야 한다. (위 db 서비스 주석 참고)
      TZ: ${TZ:-Asia/Seoul}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY 를 .env 에 설정하세요}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY 를 .env 에 설정하세요}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-interview_ai}:${MYSQL_PASSWORD:-interview_ai!}@db:3306/${MYSQL_DATABASE:-interview_ai}?charset=utf8mb4
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      INTERVIEW_DAILY_LIMIT: ${INTERVIEW_DAILY_LIMIT:-10}
      INTERVIEW_ACTIVE_LIMIT: ${INTERVIEW_ACTIVE_LIMIT:-3}
      INTERVIEW_TIME_LIMIT_MIN: ${INTERVIEW_TIME_LIMIT_MIN:-30}
      INTERVIEW_STALE_AFTER_MIN: ${INTERVIEW_STALE_AFTER_MIN:-60}
      # 영상 분석(mediapipe)을 돌릴 파이썬. 로컬에서는 protobuf 충돌 때문에 별도 venv 를
      # 쓰지만, 이 이미지는 requirements.txt 로 protobuf 4.25 가 맞게 깔려 있어 자기
      # 파이썬으로 그대로 돌린다. (기본값이 윈도우 경로라 지정하지 않으면 분석이 실패한다)
      VIDEO_ANALYZER_PYTHON: ${VIDEO_ANALYZER_PYTHON:-python}
    ports:
      - "8000:8000"
    volumes:
      # 마운트하지 않으면 컨테이너 재시작마다 업로드된 영상과 진행 중이던
      # 면접이 사라진다. /app/var 에는 체크포인트와 직무 지식 인덱스가 함께 남는다.
      - video_data:/app/uploads/videos
      - app_state:/app/var
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    # api 와 같은 이미지를 쓰고 실행 명령만 다르다. 레이어 캐시가 살아 있어
    # 두 번째 빌드는 거의 즉시 끝난다.
    build: .
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # 백엔드 주소가 두 벌인 이유:
      #
      #   API_BASE_URL         Streamlit 서버가 백엔드를 부를 때. 컨테이너끼리
      #                        통신하므로 서비스 이름(api)을 쓴다.
      #   PUBLIC_API_BASE_URL  화면의 자바스크립트가 부를 때. STT 업로드처럼
      #                        사용자 브라우저에서 나가는 요청이라 밖에서 닿는
      #                        주소여야 한다. 여기에 http://api:8000 을 넣으면
      #                        사용자 PC 에서 그 이름을 찾지 못해 실패한다.
      #
      # 배포할 때는 PUBLIC_API_BASE_URL 과 CORS_ORIGINS 를 실제 주소로 바꾼다.
      TZ: ${TZ:-Asia/Seoul}
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "8501:8501"
    command:
      - streamlit
      - run
      - frontend/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      # 컨테이너에는 브라우저도 사용자 입력도 없다. headless 가 아니면
      # 첫 실행에서 이메일을 물으며 멈춘다.
      - --server.headless=true
      - --browser.gatherUsageStats=false
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 화면과 API 를 한 주소로 합치는 리버스 프록시.
  #
  # 브라우저가 카메라·마이크를 쓰려면 HTTPS 가 필요한데(localhost 는 예외),
  # 주소가 8501·8000 둘이면 인증서도 두 벌이 된다. 앞에 이걸 세우면 한 벌로 끝나고
  # 같은 출처가 되어 CORS 도 필요 없어진다.
  #
  # 배포할 때는 .env 에 이렇게 준다.
  #   PUBLIC_API_BASE_URL=https://<주소>/api
  #   CORS_ORIGINS=https://<주소>
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # localhost 가 아니라 127.0.0.1 이어야 한다. nginx 의 listen 80 은 IPv4 만 듣는데
      # 컨테이너 안에서 localhost 는 ::1(IPv6)로 먼저 풀려 Connection refused 가 난다.
      # (db 서비스 헬스체크와 같은 이유다)
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/_stcore/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
  video_data:
  app_state:
