# 화면(Streamlit)과 API(FastAPI)를 한 주소로 합치는 리버스 프록시.
#
# 이렇게 하는 이유:
#   1) 브라우저가 카메라·마이크를 쓰려면 HTTPS 가 필요한데, 주소가 둘이면
#      인증서도 두 벌이 된다. 하나로 합치면 한 벌로 끝난다.
#   2) 같은 출처가 되어 CORS 가 필요 없어진다.
#
# 경로 규칙
#   /        → web:8501   (Streamlit. 웹소켓을 쓰므로 Upgrade 헤더를 넘겨야 한다)
#   /api/    → api:8000   (FastAPI. /api 접두사를 떼고 넘긴다)
#
# 프론트에는 PUBLIC_API_BASE_URL=https://<주소>/api 를 준다. 화면의 자바스크립트가
# 그 값 뒤에 /interview/... 를 붙이므로 코드를 고치지 않아도 경로가 맞는다.

upstream web_upstream {
    server web:8501;
}

upstream api_upstream {
    server api:8000;
}

# Streamlit 의 JS 번들이 930KB 다.
# 압축하지 않으면 시드니 리전까지 받는 데 5초가 걸려 첫 화면이 그만큼 늦게 뜬다.
#
# gzip_proxied any 가 핵심이다.
# 기본값은 off 라서, 프록시를 거쳐 온 응답은 gzip on 만으로는 압축되지 않는다.
gzip              on;
gzip_proxied      any;
gzip_min_length   1024;
gzip_types        text/plain
                  text/css
                  application/javascript
                  application/json
                  image/svg+xml;

server {
    listen 80;
    server_name _;

    # 면접 영상이 80MB 를 넘길 수 있다. 기본값 1MB 로는 413 이 난다.
    # 백엔드 상한(VIDEO_MAX_UPLOAD_MB, 기본 200)보다 크게 잡아 여기서 먼저 막지 않는다.
    client_max_body_size 300m;

    # 면접 시작이 90~140초 걸린다. 기본 60초면 프록시가 먼저 끊는다.
    proxy_connect_timeout 75s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location /api/ {
        # 끝의 슬래시가 /api 접두사를 떼어 준다. (/api/interview/x → /interview/x)
        proxy_pass http://api_upstream/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 면접 준비 진행 상황이 NDJSON 으로 한 줄씩 내려온다.
        # 버퍼링을 켜두면 다 끝난 뒤 한꺼번에 나와 진행 표시가 무의미해진다.
        proxy_buffering off;
    }

    location / {
        proxy_pass http://web_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit 은 브라우저와 웹소켓으로 통신한다. 이 두 줄이 없으면
        # 화면은 뜨는데 버튼이 아무 반응도 하지 않는다.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
