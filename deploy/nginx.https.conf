# HTTPS 배포용 프록시 설정. deploy/nginx.conf 의 HTTPS 판이다.
#
# 기본 설정(nginx.conf)은 80 포트로 HTTP 만 받는다.
# 이 파일은 docker-compose.https.yml 과 함께 쓸 때만 적용된다.
#
# 인증서 경로에 도메인이 박혀 있다.
# Elastic IP 가 바뀌면 sslip.io 도메인이 바뀌므로 아래 두 줄과
# .env 의 PUBLIC_API_BASE_URL·CORS_ORIGINS 를 같이 고쳐야 한다.
#
# 발급 명령 (호스트에서, 80 포트가 비어 있어야 한다)
#   sudo certbot certonly --standalone -d 15-134-182-6.sslip.io

upstream web_upstream {
    server web:8501;
}

upstream api_upstream {
    server api:8000;
}

# Streamlit 의 JS 번들이 930KB 다.
# 압축하지 않으면 시드니 리전까지 받는 데 5초가 걸려 첫 화면이 그만큼 늦게 뜬다.
#
# gzip_proxied any 가 핵심이다.
# 기본값은 off 라서, 프록시를 거쳐 온 응답은 gzip on 만으로는 압축되지 않는다.
gzip              on;
gzip_proxied      any;
gzip_min_length   1024;
gzip_types        text/plain
                  text/css
                  application/javascript
                  application/json
                  image/svg+xml;

server {
    listen 80;
    server_name _;

    # 컨테이너 헬스체크가 127.0.0.1:80 으로 들어온다.
    # 아래 리다이렉트에 걸리면 Host 가 127.0.0.1 이라 인증서가 맞지 않아 실패한다.
    # 그래서 이 경로만 리다이렉트하지 않고 그대로 넘긴다.
    location /_stcore/health {
        proxy_pass http://web_upstream;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/15-134-182-6.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/15-134-182-6.sslip.io/privkey.pem;

    # 면접 영상이 80MB 를 넘길 수 있다. 기본값 1MB 로는 413 이 난다.
    # 백엔드 상한(VIDEO_MAX_UPLOAD_MB, 기본 200)보다 크게 잡아 여기서 먼저 막지 않는다.
    client_max_body_size 300m;

    # 면접 시작이 90~140초, 리포트 생성이 90초 안팎 걸린다.
    # 기본 60초면 프록시가 먼저 끊는다.
    proxy_connect_timeout 75s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location /api/ {
        # 끝의 슬래시가 /api 접두사를 떼어 준다. (/api/interview/x → /interview/x)
        proxy_pass http://api_upstream/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 면접 준비 진행 상황이 NDJSON 으로 한 줄씩 내려온다.
        # 버퍼링을 켜두면 다 끝난 뒤 한꺼번에 나와 진행 표시가 무의미해진다.
        proxy_buffering off;
    }

    # 탭 아이콘은 프록시가 직접 준다. 사유는 deploy/nginx.conf 의 같은 블록 주석 참고.
    location = /favicon.ico                      { alias /srv/brand/favicon.png; types {} default_type image/png; expires 1d; access_log off; }
    location = /favicon.png                      { alias /srv/brand/favicon.png; types {} default_type image/png; expires 1d; access_log off; }
    location = /apple-touch-icon.png             { alias /srv/brand/favicon.png; types {} default_type image/png; expires 1d; access_log off; }
    location = /apple-touch-icon-precomposed.png { alias /srv/brand/favicon.png; types {} default_type image/png; expires 1d; access_log off; }

    location / {
        proxy_pass http://web_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit 은 브라우저와 웹소켓으로 통신한다. 이 두 줄이 없으면
        # 화면은 뜨는데 버튼이 아무 반응도 하지 않는다.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
